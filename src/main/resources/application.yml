server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: trade-matching-engine
  datasource:
    url: jdbc:h2:mem:tradedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

trade:
  simulator:
    enabled: ${SIMULATOR_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
